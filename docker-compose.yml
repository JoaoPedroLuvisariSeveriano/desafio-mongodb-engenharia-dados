services:
  mongodb:
    image: mongo:7
    container_name: desafio-mongodb-rs0
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "${MONGO_PORT:-27017}"]
    ports:
      - "${MONGO_PORT:-27017}:${MONGO_PORT:-27017}"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--port",
          "${MONGO_PORT:-27017}",
          "--quiet",
          "--eval",
          "try { if (rs.status().myState === 1) { quit(0); } } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:${MONGO_PORT:-27017}' }] }); } quit(1);"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  mongo-express:
    image: mongo-express:latest
    container_name: desafio-mongo-express
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: "mongodb://mongodb:${MONGO_PORT:-27017}/?directConnection=true"
      ME_CONFIG_BASICAUTH: "false"
      ME_CONFIG_BASICAUTH_ENABLED: "false"

volumes:
  mongodb_data:
